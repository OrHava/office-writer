<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Writer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --bg:#e9ebee; --panel:#ffffff; --ink:#1c1f26; --muted:#6b7280; --line:#d9dce2;
  --accent:#2457c5; --accent-ink:#ffffff; --paper:#ffffff; --hover:#eef2fb; --danger:#c43c3c;
  --ui:"IBM Plex Sans",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#17191e; --panel:#22252c; --ink:#e7e9ee; --muted:#9aa1ad; --line:#363a44;
  --accent:#6b94ea; --hover:#2d3240; --paper:#2a2d35;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ui);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;border-radius:6px;padding:6px 8px;line-height:1}
button:hover{background:var(--hover)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.on{background:var(--accent);color:var(--accent-ink)}
select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:6px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:5px;background:var(--accent);display:inline-block}
#title{border:1px solid transparent;border-radius:6px;padding:5px 8px;min-width:200px;font-weight:500;background:transparent}
#title:hover,#title:focus{border-color:var(--line);background:var(--panel)}
.menu{position:relative}
.menu > button{padding:6px 10px}
.menu ul{position:absolute;top:100%;left:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);list-style:none;margin:4px 0 0;padding:6px;min-width:220px;display:none;z-index:50}
.menu.open ul{display:block}
.menu li button{width:100%;text-align:left;display:flex;justify-content:space-between;gap:16px;padding:7px 10px}
.menu li button kbd{color:var(--muted);font-family:var(--ui);font-size:12px}
.menu li.sep{border-top:1px solid var(--line);margin:6px 0}
.status{margin-left:auto;color:var(--muted);font-size:13px;display:flex;gap:14px;align-items:center}
.toolbar{background:var(--panel);border-bottom:1px solid var(--line);padding:4px 10px;display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.toolbar .g{display:flex;align-items:center;gap:1px;padding:0 6px;border-right:1px solid var(--line)}
.toolbar .g:last-child{border:0}
.toolbar button{min-width:30px;height:30px;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.toolbar button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toolbar select{height:30px}
.colorbtn{position:relative}
.colorbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.colorbtn .bar{position:absolute;left:7px;right:7px;bottom:4px;height:3px;border-radius:2px}
main{flex:1;display:flex;overflow:hidden}
aside{width:250px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin .2s}
aside.hidden{margin-left:-250px}
aside h2{font-size:12px;font-weight:600;color:var(--muted);margin:14px 14px 6px}
aside .list{overflow:auto;flex:1}
aside .doc{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;border-left:3px solid transparent}
aside .doc:hover{background:var(--hover)}
aside .doc.active{border-left-color:var(--accent);background:var(--hover)}
aside .doc .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
aside .doc .t{color:var(--muted);font-size:11px}
aside .doc .x{opacity:0;color:var(--muted)}
aside .doc:hover .x{opacity:1}
aside .new{margin:10px 14px;background:var(--accent);color:var(--accent-ink);padding:8px;text-align:center}
aside .new:hover{background:var(--accent);filter:brightness(1.1)}
.canvas{flex:1;overflow:auto;padding:28px 20px;display:flex;justify-content:center;align-items:flex-start}
.page{background:var(--paper);width:816px;min-height:1056px;padding:96px;box-shadow:0 1px 3px rgba(0,0,0,.18),0 12px 40px rgba(0,0,0,.08);transform-origin:top center;outline:none;
  font-family:"Source Serif 4",Georgia,serif;font-size:12pt;line-height:1.5;color:#1c1f26;word-wrap:break-word}
:root[data-theme="dark"] .page{color:#e7e9ee}
.page:focus{outline:none}
.page p{margin:0 0 10pt}
.page h1{font-size:24pt;margin:14pt 0 8pt;line-height:1.2}
.page h2{font-size:18pt;margin:12pt 0 6pt;line-height:1.25}
.page h3{font-size:14pt;margin:10pt 0 4pt}
.page blockquote{border-left:3px solid var(--line);margin:0 0 10pt;padding:2pt 12pt;color:var(--muted)}
.page pre{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10pt;background:rgba(127,127,127,.12);padding:8pt;border-radius:4pt;white-space:pre-wrap}
.page table{border-collapse:collapse;margin:0 0 10pt;width:100%}
.page td,.page th{border:1px solid #9aa1ad;padding:4pt 6pt;min-width:40px;vertical-align:top}
.page img{max-width:100%;height:auto}
.page hr{border:0;border-top:1px solid #9aa1ad;margin:12pt 0}
.page a{color:var(--accent)}
.page[dir=rtl]{text-align:right}
.page mark.find{background:#ffd54a;color:#000}
.page mark.find.cur{background:#ff9a2e}
.find{display:none;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 12px;gap:8px;align-items:center}
.find.show{display:flex;flex-wrap:wrap}
.find input{width:180px}
.find .cnt{color:var(--muted);font-size:13px;min-width:60px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px 22px;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 12px;font-size:16px}
dialog label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
dialog input,dialog select{width:100%}
dialog .row{display:flex;gap:10px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
dialog .actions .primary{background:var(--accent);color:var(--accent-ink);padding:7px 14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.tablegrid{display:grid;grid-template-columns:repeat(10,18px);gap:3px;padding:8px}
.tablegrid span{width:18px;height:18px;border:1px solid var(--line);border-radius:3px;cursor:pointer}
.tablegrid span.hi{background:var(--accent);border-color:var(--accent)}
.tg-label{text-align:center;color:var(--muted);font-size:12px;padding-bottom:6px}
@media (max-width:900px){
  body{padding-top:env(safe-area-inset-top)}
  header{padding:6px 8px;gap:6px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}header::-webkit-scrollbar{display:none}
  header .brand span{display:none}#title{min-width:120px;width:140px;flex:none}.status{display:none}
  .menu > button{padding:6px 8px;white-space:nowrap}.menu ul{position:fixed;left:8px;right:8px;top:auto;width:auto;max-height:70vh;overflow:auto;font-size:15px}
  .toolbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:4px 6px;-webkit-overflow-scrolling:touch}.toolbar::-webkit-scrollbar{display:none}.toolbar .g{flex:none}
  .toolbar button{min-width:36px;height:36px;font-size:16px}.toolbar select{height:36px;font-size:14px}
  aside{position:fixed;left:0;top:0;bottom:0;z-index:40;width:min(300px,85vw);box-shadow:0 0 40px rgba(0,0,0,.3);transition:transform .2s;transform:translateX(-100%);margin:0!important}aside:not(.hidden){transform:none}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39;display:none}#scrim.show{display:block}
  .canvas{padding:8px 0;display:block}
  .page{width:100%!important;min-height:calc(100vh - 160px)!important;padding:22px 16px!important;box-shadow:none;font-size:15px;transform:none!important;margin:0!important}
  .hf{left:16px!important;right:16px!important}#hdr{top:4px!important}#ftr{bottom:4px!important}
  .guide{display:none}
  .find{position:sticky;top:0;z-index:5}.find input{width:40%}
  dialog{width:94vw;max-width:94vw;padding:16px}dialog input,dialog select{font-size:16px}
  input,select{font-size:16px}
  .menubtn{display:inline-flex!important}
}
.menubtn{display:none;font-size:20px;padding:4px 8px}
@media print{
  body *{visibility:hidden}
  .canvas,.canvas *{visibility:visible}
  .canvas{position:absolute;inset:0;padding:0;overflow:visible;display:block}
  .page{box-shadow:none;width:auto;min-height:0;padding:0;transform:none!important}
  mark.find{background:none;color:inherit}
}
@page{size:A4;margin:25mm}
.page{position:relative}
.page .guide{position:absolute;left:0;right:0;pointer-events:none;border-top:2px dashed #c3c8d2;z-index:1}
.page .guide::after{content:attr(data-n);position:absolute;right:8px;top:-18px;font:11px var(--ui);color:#9aa1ad}
.hf{position:absolute;left:96px;right:96px;font:10pt var(--ui);color:#6b7280;min-height:16px;outline:none;z-index:2}
.hf:empty::before{content:attr(placeholder);color:#c3c8d2}
#hdr{top:40px}#ftr{bottom:40px}
.page.cols2 > :not(.hf):not(.guide){column-count:2;column-gap:28px}
.page .cols-wrap{column-gap:28px}
.page span.cmt{background:#fff1a8;border-bottom:2px solid #e3b900;cursor:pointer}
:root[data-theme="dark"] .page span.cmt{background:#5a4a00}
.page span.cmt.active{background:#ffd54a}
.page .fn{vertical-align:super;font-size:70%;color:var(--accent)}
.page .footnotes{border-top:1px solid #9aa1ad;margin-top:24pt;padding-top:6pt;font-size:9pt}
.page .toc p{margin:0 0 2pt}.page .toc .l2{padding-left:16pt}.page .toc .l3{padding-left:32pt}
.page .cap{display:inline-block;margin:0 0 10pt}
.page img.sel{outline:3px solid var(--accent)}
.page .dropcap::first-letter{float:left;font-size:3.2em;line-height:.85;padding:4pt 6pt 0 0;font-weight:600}
.page input[type=checkbox]{margin-right:6px}
.imgbar{position:absolute;display:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px;gap:2px;z-index:30}
.imgbar.show{display:flex}
.imgbar button{font-size:12px;padding:4px 8px}
aside .tabs{display:flex;border-bottom:1px solid var(--line)}
aside .tabs button{flex:1;border-radius:0;padding:9px;font-size:13px;color:var(--muted)}
aside .tabs button.on{color:var(--ink);box-shadow:inset 0 -2px var(--accent);background:none}
aside .pane{display:none;overflow:auto;flex:1}aside .pane.on{display:block}
.ol-item{padding:6px 14px;cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol-item:hover{background:var(--hover)}.ol-item.l2{padding-left:26px}.ol-item.l3{padding-left:38px;color:var(--muted)}
.cm-item{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.cm-item q{color:var(--muted);display:block;font-size:12px;margin-bottom:4px;font-style:italic}
.cm-item .cm-a{display:flex;gap:6px;margin-top:6px}.cm-item .cm-a button{font-size:12px;padding:3px 7px;color:var(--muted)}
.ver{padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;align-items:center}
.ver button{font-size:12px;color:var(--accent)}
.empty{padding:16px 14px;color:var(--muted);font-size:13px}
.tpl{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tpl button{border:1px solid var(--line);padding:14px 10px;text-align:left;border-radius:8px}
.tpl button b{display:block;margin-bottom:3px}.tpl button span{font-size:12px;color:var(--muted)}
.emo{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;max-height:260px;overflow:auto}
.emo button{font-size:20px;padding:4px}
.sc{display:grid;grid-template-columns:1fr auto;gap:4px 18px;font-size:13px}.sc kbd{color:var(--muted)}
@media print{.hf{position:fixed}#hdr{top:0}#ftr{bottom:0}.guide,.imgbar{display:none!important}.page span.cmt{background:none;border:0}}
</style>
</head>

  <div class="menu" id="m-format"><button>Format</button><ul>

  <div class="menu" id="m-view"><button>View</button><ul>
    <li><button data-cmd="sidebar">Toggle documents panel</button></li>

  </ul></div>
  <div class="status"><span id="words">0 words</span><span id="saved">Saved</span></div>
</header>

<script>
/* ---------- storage ---------- */
const DB='writer.docs', page=document.getElementById('page'), titleEl=document.getElementById('title');
let docs=JSON.parse(localStorage.getItem(DB)||'[]'), cur=null, saveT=null, savedRange=null;
const uid=()=>Math.random().toString(36).slice(2,10);
function persist(){localStorage.setItem(DB,JSON.stringify(docs));}
function newDoc(html='<p><br></p>',name='Untitled document'){const d={id:uid(),name,html,dir:'ltr',updated:Date.now(),hdr:'',ftr:'',pageSetup:null,comments:[],versions:[]};docs.unshift(d);persist();load(d.id);return d;}
function load(id){
  cur=docs.find(d=>d.id===id); if(!cur)return;
  page.innerHTML=cur.html; titleEl.value=cur.name; page.dir=cur.dir||'ltr';
  document.getElementById('dirbtn').classList.toggle('on',page.dir==='rtl');
  localStorage.setItem('writer.last',id); renderList(); countWords(); setSaved(true); if(typeof afterLoad==='function')afterLoad();
}
function save(){ if(!cur)return; beforeSave(); cur.html=cleanHtml(); cur.name=titleEl.value||'Untitled document'; cur.dir=page.dir; cur.updated=Date.now(); persist(); renderList(); setSaved(true); }
function scheduleSave(){ setSaved(false); clearTimeout(saveT); saveT=setTimeout(save,600); }
function setSaved(b){document.getElementById('saved').textContent=b?'Saved':'Saving…';}
function renderList(){
  const l=document.getElementById('doclist'); l.innerHTML='';
  docs.sort((a,b)=>b.updated-a.updated).forEach(d=>{
    const el=document.createElement('div'); el.className='doc'+(cur&&d.id===cur.id?' active':'');
    el.innerHTML=`<div class="n">${esc(d.name)}<div class="t">${new Date(d.updated).toLocaleString()}</div></div><span class="x" title="Delete">✕</span>`;
    el.onclick=e=>{ if(e.target.classList.contains('x')){ if(confirm(`Delete "${d.name}"?`)) delDoc(d.id);} else { save(); load(d.id);} };
    l.appendChild(el);
  });
}
function delDoc(id){ docs=docs.filter(d=>d.id!==id); persist(); if(docs.length) load(docs[0].id); else newDoc(); }
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function countWords(){const t=page.innerText.trim();const w=t?t.split(/\s+/).length:0;document.getElementById('words').textContent=`${w} words · ${t.length} chars`;}

/* ---------- editor commands ---------- */
const ex=(c,v=null)=>{page.focus();document.execCommand(c,false,v);scheduleSave();updateState();};
function saveSel(){const s=getSelection();if(s.rangeCount&&page.contains(s.anchorNode))savedRange=s.getRangeAt(0).cloneRange();}
function restoreSel(){if(savedRange){const s=getSelection();s.removeAllRanges();s.addRange(savedRange);}page.focus();}
function insertHTML(h){restoreSel();document.execCommand('insertHTML',false,h);scheduleSave();}
function closestIn(tag){let n=getSelection().anchorNode;while(n&&n!==page){if(n.nodeType===1&&n.tagName===tag)return n;n=n.parentNode;}return null;}

const cmds={
  new:()=>{save();newDoc();},
  open:()=>document.getElementById('fileIn').click(),
  rename:()=>{document.getElementById('rn-name').value=cur.name;openDlg('dlg-rename');},
  duplicate:()=>{save();newDoc(cur.html,cur.name+' (copy)');toast('Duplicated');},
  delete:()=>{if(confirm(`Delete "${cur.name}"?`))delDoc(cur.id);},
  print:()=>window.print(),
  undo:()=>ex('undo'), redo:()=>ex('redo'), selectAll:()=>ex('selectAll'),
  bold:()=>ex('bold'), italic:()=>ex('italic'), underline:()=>ex('underline'), strikeThrough:()=>ex('strikeThrough'),
  superscript:()=>ex('superscript'), subscript:()=>ex('subscript'), removeFormat:()=>{ex('removeFormat');ex('formatBlock','p');},
  justifyLeft:()=>ex('justifyLeft'), justifyCenter:()=>ex('justifyCenter'), justifyRight:()=>ex('justifyRight'), justifyFull:()=>ex('justifyFull'),
  insertUnorderedList:()=>ex('insertUnorderedList'), insertOrderedList:()=>ex('insertOrderedList'), indent:()=>ex('indent'), outdent:()=>ex('outdent'),
  hr:()=>insertHTML('<hr><p><br></p>'),
  pagebreak:()=>insertHTML('<div style="page-break-after:always;border-top:1px dashed #9aa1ad;margin:12pt 0"></div><p><br></p>'),
  date:()=>insertHTML(new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})),
  image:()=>document.getElementById('imgIn').click(),
  link:()=>{saveSel();const a=closestIn('A');document.getElementById('lk-text').value=a?a.textContent:getSelection().toString();document.getElementById('lk-url').value=a?a.href:'';openDlg('dlg-link');},
  'table-dialog':()=>{saveSel();openDlg('dlg-table');},
  special:()=>{saveSel();openDlg('dlg-special');},
  find:()=>{document.getElementById('find').classList.add('show');document.getElementById('fq').focus();},
  'f-close':()=>{clearMarks();document.getElementById('find').classList.remove('show');},
  'f-next':()=>stepMatch(1),'f-prev':()=>stepMatch(-1),'f-rep':()=>replaceOne(),'f-repall':()=>replaceAll(),
  'paste-plain':()=>navigator.clipboard.readText().then(t=>insertHTML(esc(t).replace(/\n/g,'<br>'))),
  sidebar:()=>{const h=document.getElementById('side').classList.toggle('hidden');document.getElementById('scrim').classList.toggle('show',!h&&matchMedia('(max-width:900px)').matches);},
  theme:()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'':'dark';localStorage.setItem('writer.theme',r.dataset.theme);},
  spell:()=>{page.spellcheck=!page.spellcheck;toast('Spellcheck '+(page.spellcheck?'on':'off'));},
  dir:()=>{page.dir=page.dir==='rtl'?'ltr':'rtl';document.getElementById('dirbtn').classList.toggle('on',page.dir==='rtl');scheduleSave();},
  focus:()=>{document.getElementById('side').classList.add('hidden');document.getElementById('tb').style.display=document.getElementById('tb').style.display==='none'?'':'none';},
  'export-docx':exportDocx,
  'export-html':()=>download(cur.name+'.html',`<!DOCTYPE html><html dir="${page.dir}"><head><meta charset="utf-8"><title>${esc(cur.name)}</title><style>body{font-family:Georgia,serif;max-width:800px;margin:40px auto;line-height:1.5}table{border-collapse:collapse}td,th{border:1px solid #999;padding:4px 6px}img{max-width:100%}</style></head><body>${page.innerHTML}</body></html>`,'text/html'),
  'export-md':()=>download(cur.name+'.md',toMarkdown(page),'text/markdown'),
  'export-txt':()=>download(cur.name+'.txt',page.innerText,'text/plain'),
  't-row-above':()=>tableOp('row',0),'t-row-below':()=>tableOp('row',1),'t-col-left':()=>tableOp('col',0),'t-col-right':()=>tableOp('col',1),
  't-del-row':()=>tableOp('delrow'),'t-del-col':()=>tableOp('delcol'),'t-del':()=>tableOp('del'),
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-cmd]'); if(b){e.preventDefault();cmds[b.dataset.cmd]?.();closeMenus();return;}
  const m=e.target.closest('.menu > button'); if(m){const was=m.parentNode.classList.contains('open');closeMenus();if(!was)m.parentNode.classList.add('open');return;}
  if(!e.target.closest('.menu'))closeMenus();
  if(e.target.closest('[data-close]'))e.target.closest('dialog').close();
});
function closeMenus(){document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));}
function openDlg(id){document.getElementById(id).showModal();}
document.querySelectorAll('.toolbar button[data-cmd]').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));

/* selects & colors */
document.getElementById('block').onchange=e=>ex('formatBlock',e.target.value);
document.getElementById('font').onchange=e=>ex('fontName',e.target.value);
document.getElementById('size').onchange=e=>{ex('fontSize',7);page.querySelectorAll('font[size="7"]').forEach(f=>{f.removeAttribute('size');f.style.fontSize=e.target.value+'pt';});scheduleSave();};
document.getElementById('lh').onchange=e=>{let n=getSelection().anchorNode;while(n&&n!==page&&!(n.nodeType===1&&/^(P|H[1-6]|LI|DIV|BLOCKQUOTE)$/.test(n.tagName)))n=n.parentNode;if(n&&n!==page){n.style.lineHeight=e.target.value;scheduleSave();}};
document.getElementById('zoom').onchange=e=>{page.style.transform=`scale(${parseInt(e.target.value)/100})`;};
document.getElementById('fc').oninput=e=>{document.getElementById('fcBar').style.background=e.target.value;ex('foreColor',e.target.value);};
document.getElementById('bc').oninput=e=>{document.getElementById('bcBar').style.background=e.target.value;ex('hiliteColor',e.target.value);};
document.querySelectorAll('.colorbtn input').forEach(i=>{i.addEventListener('mousedown',saveSel);i.addEventListener('focus',restoreSel);});

function updateState(){
  ['bold','italic','underline','strikeThrough','superscript','subscript','justifyLeft','justifyCenter','justifyRight','justifyFull','insertUnorderedList','insertOrderedList'].forEach(c=>{
    const b=document.querySelector(`.toolbar [data-cmd="${c}"]`); if(b) b.classList.toggle('on',document.queryCommandState(c));
  });
  const blk=(document.queryCommandValue('formatBlock')||'p').toLowerCase();
  const bs=document.getElementById('block'); if([...bs.options].some(o=>o.value===blk))bs.value=blk; else bs.value='p';
  const fn=(document.queryCommandValue('fontName')||'').replace(/["']/g,'').split(',')[0]; const fs=document.getElementById('font'); if(fn)[...fs.options].forEach(o=>{if(o.value.toLowerCase()===fn.toLowerCase())fs.value=o.value;});
  let n=getSelection().anchorNode; if(n&&n.nodeType===3)n=n.parentNode; if(n&&page.contains(n)){const px=parseFloat(getComputedStyle(n).fontSize);const pt=Math.round(px*0.75);const ss=document.getElementById('size');if([...ss.options].some(o=>+o.value===pt))ss.value=pt;}
}
document.addEventListener('selectionchange',()=>{if(page.contains(getSelection().anchorNode))updateState();});
page.addEventListener('input',()=>{scheduleSave();countWords();});
page.addEventListener('paste',e=>{
  const html=e.clipboardData.getData('text/html'); if(!html)return; e.preventDefault();
  const d=new DOMParser().parseFromString(html,'text/html');
  d.querySelectorAll('script,style,meta,link').forEach(n=>n.remove());
  d.body.querySelectorAll('*').forEach(n=>{for(const a of [...n.attributes]){if(/^on/i.test(a.name)||a.name==='class'||a.name==='id')n.removeAttribute(a.name);}});
  document.execCommand('insertHTML',false,d.body.innerHTML);
});
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(), c=e.ctrlKey||e.metaKey;
  if(c&&e.altKey&&k==='n'){e.preventDefault();cmds.new();}
  else if(c&&k==='s'){e.preventDefault();save();toast('Saved');}
  else if(c&&k==='h'){e.preventDefault();cmds.find();}
  else if(c&&k==='k'){e.preventDefault();cmds.link();}
  else if(c&&k==='p'){e.preventDefault();window.print();}
  else if(c&&e.shiftKey&&k==='v'){e.preventDefault();cmds['paste-plain']();}
  else if(e.key==='F11'){e.preventDefault();cmds.focus();}
  else if(e.key==='Escape'){closeMenus();}
  else if(e.key==='Tab'&&page.contains(getSelection().anchorNode)&&!closestIn('TD')){e.preventDefault();ex(e.shiftKey?'outdent':'indent');}
});
window.addEventListener('beforeunload',save);

/* link / table / special dialogs */
document.getElementById('lk-ok').onclick=()=>{const t=document.getElementById('lk-text').value,u=document.getElementById('lk-url').value;document.getElementById('dlg-link').close();if(!u)return;const a=closestIn('A');if(a){a.href=u;a.textContent=t||u;scheduleSave();}else insertHTML(`<a href="${esc(u)}" target="_blank">${esc(t||u)}</a>`);};
document.getElementById('tb-ok').onclick=()=>{document.getElementById('dlg-table').close();insertTable(+document.getElementById('tb-r').value,+document.getElementById('tb-c').value,document.getElementById('tb-h').checked);};
function insertTable(r,c,h){let s='<table>';for(let i=0;i<r;i++){s+='<tr>';for(let j=0;j<c;j++)s+=(h&&i===0)?'<th><br></th>':'<td><br></td>';s+='</tr>';}insertHTML(s+'</table><p><br></p>');}
const tg=document.getElementById('tg');for(let i=0;i<80;i++){const s=document.createElement('span');s.dataset.r=Math.floor(i/10)+1;s.dataset.c=i%10+1;s.onmouseover=()=>{tg.querySelectorAll('span').forEach(x=>x.classList.toggle('hi',+x.dataset.r<=+s.dataset.r&&+x.dataset.c<=+s.dataset.c));document.getElementById('tgl').textContent=`${s.dataset.r} × ${s.dataset.c}`;};s.onclick=()=>{closeMenus();insertTable(+s.dataset.r,+s.dataset.c,true);};tg.appendChild(s);}
document.getElementById('m-table').querySelector('button').addEventListener('mousedown',saveSel);
function tableOp(op,after){
  const td=closestIn('TD')||closestIn('TH'); if(!td){toast('Place the cursor inside a table');return;}
  const tr=td.parentNode, tbl=closestIn('TABLE'), ci=[...tr.children].indexOf(td);
  if(op==='row'){const n=tr.cloneNode(true);n.querySelectorAll('td,th').forEach(x=>x.innerHTML='<br>');tr.parentNode.insertBefore(n,after?tr.nextSibling:tr);}
  if(op==='col')tbl.querySelectorAll('tr').forEach(r=>{const ref=r.children[ci];const n=document.createElement(ref.tagName);n.innerHTML='<br>';r.insertBefore(n,after?ref.nextSibling:ref);});
  if(op==='delrow'){tr.remove();if(!tbl.querySelector('tr'))tbl.remove();}
  if(op==='delcol'){tbl.querySelectorAll('tr').forEach(r=>r.children[ci]?.remove());if(!tbl.querySelector('td,th'))tbl.remove();}
  if(op==='del')tbl.remove();
  scheduleSave();
}
const sp='© ® ™ € £ ¥ ₪ § ¶ † ‡ • … ‰ ′ ″ ‹ › « » ‘ ’ “ ” – — ← → ↑ ↓ ↔ ⇒ ∞ ≈ ≠ ≤ ≥ ± × ÷ √ ∑ π Ω µ ° ½ ¼ ¾ ★ ☆ ✓ ✗ ♥ ♦ ♣ ♠ α β γ δ λ σ'.split(' ');
const spc=document.getElementById('spchars');sp.forEach(ch=>{const b=document.createElement('button');b.textContent=ch;b.style.fontSize='18px';b.onclick=()=>{document.getElementById('dlg-special').close();insertHTML(ch);};spc.appendChild(b);});
document.getElementById('rn-ok').onclick=()=>{titleEl.value=document.getElementById('rn-name').value;document.getElementById('dlg-rename').close();save();};
titleEl.addEventListener('input',scheduleSave);

/* images */
document.getElementById('imgIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>insertHTML(`<img src="${r.result}" alt="${esc(f.name)}">`);r.readAsDataURL(f);e.target.value='';};
page.addEventListener('drop',e=>{const f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image/'));if(!f)return;e.preventDefault();const r=new FileReader();r.onload=()=>{page.focus();document.execCommand('insertHTML',false,`<img src="${r.result}">`);scheduleSave();};r.readAsDataURL(f);});

/* find & replace */
let marks=[],mi=-1;
function clearMarks(){page.querySelectorAll('mark.find').forEach(m=>m.replaceWith(...m.childNodes));page.normalize();marks=[];mi=-1;document.getElementById('fcnt').textContent='';}
function doFind(){
  clearMarks();const q=document.getElementById('fq').value;if(!q)return;
  const cs=document.getElementById('fcase').checked;const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),cs?'g':'gi');
  const w=document.createTreeWalker(page,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{if(!re.test(n.data))return;re.lastIndex=0;const frag=document.createDocumentFragment();let last=0,m;while((m=re.exec(n.data))){frag.append(n.data.slice(last,m.index));const mk=document.createElement('mark');mk.className='find';mk.textContent=m[0];frag.append(mk);marks.push(mk);last=m.index+m[0].length;}frag.append(n.data.slice(last));n.replaceWith(frag);});

function mdToHtml(md){
  const lines=md.split('\n');let out='',list=null;const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2">$1</a>');
  const closeList=()=>{if(list){out+=`</${list}>`;list=null;}};
  for(const l of lines){let m;
    if((m=l.match(/^(#{1,3})\s+(.*)/))){closeList();out+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`;}
    else if((m=l.match(/^\s*[-*]\s+(.*)/))){if(list!=='ul'){closeList();out+='<ul>';list='ul';}out+=`<li>${inl(m[1])}</li>`;}
    else if((m=l.match(/^\s*\d+\.\s+(.*)/))){if(list!=='ol'){closeList();out+='<ol>';list='ol';}out+=`<li>${inl(m[1])}</li>`;}

    switch(t){case 'H1':return `# ${c}\n\n`;case 'H2':return `## ${c}\n\n`;case 'H3':return `### ${c}\n\n`;case 'P':case 'DIV':return c.trim()?`${c}\n\n`:'';case 'BR':return '\n';case 'B':case 'STRONG':return `**${c}**`;case 'I':case 'EM':return `*${c}*`;case 'S':case 'STRIKE':return `~~${c}~~`;case 'CODE':return `\`${c}\``;case 'PRE':return `\`\`\`\n${n.innerText}\n\`\`\`\n\n`;case 'A':return `[${c}](${n.href})`;case 'IMG':return `![${n.alt||''}](${n.src.slice(0,80)}…)`;case 'HR':return `---\n\n`;case 'BLOCKQUOTE':return `> ${c.trim()}\n\n`;
      case 'UL':return [...n.children].map(li=>`- ${walk(li).trim()}`).join('\n')+'\n\n';case 'OL':return [...n.children].map((li,i)=>`${i+1}. ${walk(li).trim()}`).join('\n')+'\n\n';
      case 'TABLE':{const rows=[...n.querySelectorAll('tr')].map(r=>[...r.children].map(x=>walk(x).trim().replace(/\|/g,'\\|')));if(!rows.length)return '';return `| ${rows[0].join(' | ')} |\n| ${rows[0].map(()=>'---').join(' | ')} |\n`+rows.slice(1).map(r=>`| ${r.join(' | ')} |`).join('\n')+'\n\n';}
      default:return c;}};

}

let gT;page.addEventListener('input',()=>{clearTimeout(gT);gT=setTimeout(()=>{drawGuides();renderOutline();},400);});
/* sidebar tabs */
document.querySelectorAll('aside .tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('aside .tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('aside .pane').forEach(p=>p.classList.toggle('on',p.dataset.pane===b.dataset.tab));});
function renderOutline(){const o=document.getElementById('outline');const hs=[...page.querySelectorAll('h1,h2,h3')];o.innerHTML=hs.length?'':'<div class="empty">Headings you add will appear here for quick navigation.</div>';hs.forEach(h=>{const d=document.createElement('div');d.className='ol-item l'+h.tagName[1];d.textContent=h.textContent||'(empty heading)';d.onclick=()=>h.scrollIntoView({block:'center',behavior:'smooth'});o.appendChild(d);});}
/* comments */
function renderComments(){const l=document.getElementById('cmlist');l.innerHTML='';const live=cur.comments.filter(c=>page.querySelector(`[data-cid="${c.id}"]`));if(!live.length){l.innerHTML='<div class="empty">Select text and use Insert → Comment.</div>';return;}
  live.forEach(c=>{const sp=page.querySelector(`[data-cid="${c.id}"]`);const d=document.createElement('div');d.className='cm-item';d.innerHTML=`<q>${esc(sp.textContent.slice(0,80))}</q>${esc(c.text)}<div class="cm-a"><button data-a="go">Show</button><button data-a="edit">Edit</button><button data-a="resolve">Resolve</button></div>`;
    d.onclick=e=>{const a=e.target.dataset.a;if(a==='go'){page.querySelectorAll('.cmt.active').forEach(x=>x.classList.remove('active'));sp.classList.add('active');sp.scrollIntoView({block:'center'});}if(a==='edit'){const t=prompt('Edit comment',c.text);if(t!=null){c.text=t;save();renderComments();}}if(a==='resolve'){sp.replaceWith(...sp.childNodes);cur.comments=cur.comments.filter(x=>x!==c);page.normalize();save();renderComments();}};l.appendChild(d);});}
document.getElementById('cm-ok').onclick=()=>{const t=document.getElementById('cm-text').value.trim();document.getElementById('dlg-comment').close();if(!t)return;restoreSel();const r=getSelection().getRangeAt(0);if(r.collapsed){toast('Select some text first');return;}const id=uid();try{const sp=document.createElement('span');sp.className='cmt';sp.dataset.cid=id;r.surroundContents(sp);}catch(e){document.execCommand('insertHTML',false,`<span class="cmt" data-cid="${id}">${esc(r.toString())}</span>`);}cur.comments.push({id,text:t,t:Date.now()});save();renderComments();document.querySelector('[data-tab="comments"]').click();};
page.addEventListener('click',e=>{const c=e.target.closest('.cmt');if(c){document.querySelector('[data-tab="comments"]').click();}});
/* versions */
function renderVersions(){const l=document.getElementById('verlist');l.innerHTML='';if(!cur.versions.length){l.innerHTML='<div class="empty">Snapshots are taken automatically as you work (every few minutes).</div>';return;}
  [...cur.versions].reverse().forEach(v=>{const d=document.createElement('div');d.className='ver';d.innerHTML=`<span>${new Date(v.t).toLocaleString()}<br><small style="color:var(--muted)">${v.words} words</small></span><button>Restore</button>`;d.querySelector('button').onclick=()=>{if(confirm('Restore this version? Current text will be saved as a new snapshot.')){cur.versions.push({t:Date.now(),html:page.innerHTML,words:0});page.innerHTML=v.html;save();afterLoad();toast('Version restored');}};l.appendChild(d);});}
/* templates */
const TPL={
 blank:['Blank','Start from an empty page','<p><br></p>'],
 letter:['Letter','Formal letter layout',`<p style="text-align:right">${new Date().toLocaleDateString()}</p><p>Recipient name<br>Company<br>Address</p><p><br></p><p>Dear Recipient,</p><p>Opening paragraph that states the purpose of the letter.</p><p>Second paragraph with supporting details.</p><p>Closing paragraph with a clear request or next step.</p><p><br></p><p>Sincerely,</p><p><b>Your name</b><br>Title</p>`],
 resume:['Resume','Clean one-page CV',`<h1>Your Name</h1><p>City · phone · email · linkedin.com/in/you</p><h2>Summary</h2><p>Two or three lines describing what you do and what you are best at.</p><h2>Experience</h2><p><b>Job title</b>, Company — 2022–present</p><ul><li>Achievement with a measurable result</li><li>Responsibility or project you led</li></ul><p><b>Job title</b>, Company — 2019–2022</p><ul><li>Achievement</li></ul><h2>Education</h2><p><b>Degree</b>, University — year</p><h2>Skills</h2><p>Skill, skill, skill, skill</p>`],
 notes:['Meeting notes','Agenda, decisions, action items',`<h1>Meeting notes</h1><p><b>Date:</b> ${new Date().toLocaleDateString()} &nbsp; <b>Attendees:</b> </p><h2>Agenda</h2><ol><li>Topic</li><li>Topic</li></ol><h2>Discussion</h2><p></p><h2>Decisions</h2><ul><li></li></ul><h2>Action items</h2><table><tr><th>Task</th><th>Owner</th><th>Due</th></tr><tr><td><br></td><td><br></td><td><br></td></tr></table>`],
 report:['Report','Title page, sections, TOC',`<h1>Report title</h1><p>Author · ${new Date().toLocaleDateString()}</p><h2>1. Introduction</h2><p>Background and goals.</p><h2>2. Method</h2><p>How the work was done.</p><h2>3. Findings</h2><p>Key results.</p><h2>4. Conclusion</h2><p>Summary and recommendations.</p>`],
 memo:['Memo','Internal memorandum',`<h1>Memorandum</h1><table><tr><td><b>To</b></td><td>Team</td></tr><tr><td><b>From</b></td><td>Your name</td></tr><tr><td><b>Date</b></td><td>${new Date().toLocaleDateString()}</td></tr><tr><td><b>Subject</b></td><td>Subject line</td></tr></table><p>Body of the memo.</p>`],
};
const tb=document.getElementById('tplBody');Object.entries(TPL).forEach(([k,[n,d,h]])=>{const b=document.createElement('button');b.innerHTML=`<b>${n}</b><span>${d}</span>`;b.onclick=()=>{document.getElementById('dlg-tpl').close();save();newDoc(h,k==='blank'?'Untitled document':n);};tb.appendChild(b);});
cmds.new=()=>openDlg('dlg-tpl');
/* page setup */
cmds.pagesetup=()=>{const ps=cur.pageSetup||{size:'a4',orient:'portrait',m:[25,25,25,25]};document.getElementById('ps-size').value=ps.size;document.getElementById('ps-orient').value=ps.orient;['top','right','bottom','left'].forEach((k,i)=>document.getElementById('ps-'+k).value=ps.m[i]);openDlg('dlg-page');};
document.getElementById('ps-ok').onclick=()=>{cur.pageSetup={size:document.getElementById('ps-size').value,orient:document.getElementById('ps-orient').value,m:['top','right','bottom','left'].map(k=>+document.getElementById('ps-'+k).value||0)};document.getElementById('dlg-page').close();applyPageSetup(cur.pageSetup);save();};
cmds.guides=()=>{guidesOn=!guidesOn;localStorage.setItem('writer.guides',guidesOn?'1':'0');drawGuides();};
cmds.headerfooter=()=>{const show=hdr.style.display==='none';hdr.style.display=ftr.style.display=show?'':'none';if(show)hdr.focus();};
/* stats & shortcuts */
cmds.stats=()=>{const t=page.innerText,w=t.trim()?t.trim().split(/\s+/).length:0;const rows=[['Words',w],['Characters',t.length],['Characters (no spaces)',t.replace(/\s/g,'').length],['Paragraphs',[...page.querySelectorAll('p,h1,h2,h3,li,blockquote')].filter(p=>p.innerText.trim()).length],['Sentences',(t.match(/[.!?](\s|$)/g)||[]).length],['Pages (approx.)',page.querySelectorAll('.guide').length+1],['Reading time',Math.max(1,Math.round(w/220))+' min'],['Images',page.querySelectorAll('img').length],['Tables',page.querySelectorAll('table').length]];document.getElementById('statsBody').innerHTML=rows.map(r=>`<span>${r[0]}</span><b>${r[1]}</b>`).join('');openDlg('dlg-stats');};
cmds.shortcuts=()=>{const k=[['Bold','Ctrl+B'],['Italic','Ctrl+I'],['Underline','Ctrl+U'],['Save','Ctrl+S'],['Find & replace','Ctrl+H'],['Link','Ctrl+K'],['Comment','Ctrl+Alt+M'],['New document','Ctrl+Alt+N'],['Print / PDF','Ctrl+P'],['Paste plain text','Ctrl+Shift+V'],['Indent / outdent','Tab / Shift+Tab'],['Undo / redo','Ctrl+Z / Ctrl+Y'],['Focus mode','F11'],['Open link','Ctrl+click']];document.getElementById('scBody').innerHTML=k.map(r=>`<span>${r[0]}</span><kbd>${r[1]}</kbd>`).join('');openDlg('dlg-shortcuts');};
/* format */
function changeCase(fn){const s=getSelection();if(!s.rangeCount||s.isCollapsed){toast('Select text first');return;}const r=s.getRangeAt(0);const w=document.createTreeWalker(r.commonAncestorContainer,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())if(r.intersectsNode(w.currentNode))nodes.push(w.currentNode);if(!nodes.length&&r.commonAncestorContainer.nodeType===3)nodes.push(r.commonAncestorContainer);nodes.forEach(n=>{const a=n===r.startContainer?r.startOffset:0,b=n===r.endContainer?r.endOffset:n.data.length;n.data=n.data.slice(0,a)+fn(n.data.slice(a,b))+n.data.slice(b);});scheduleSave();}
cmds['case-upper']=()=>changeCase(t=>t.toUpperCase());cmds['case-lower']=()=>changeCase(t=>t.toLowerCase());
cmds['case-title']=()=>changeCase(t=>t.replace(/\p{L}[\p{L}']*/gu,w=>w[0].toUpperCase()+w.slice(1).toLowerCase()));
cmds['case-sentence']=()=>changeCase(t=>t.toLowerCase().replace(/(^\s*\p{L}|[.!?]\s+\p{L})/gu,m=>m.toUpperCase()));
function listStyle(tag,style){let l=closestIn('UL')||closestIn('OL');if(!l){ex(tag==='UL'?'insertUnorderedList':'insertOrderedList');l=closestIn('UL')||closestIn('OL');}if(!l)return;if(l.tagName!==tag){const n=document.createElement(tag);n.innerHTML=l.innerHTML;l.replaceWith(n);l=n;}l.style.listStyleType=style;scheduleSave();}
cmds['bul-disc']=()=>listStyle('UL','disc');cmds['bul-circle']=()=>listStyle('UL','circle');cmds['bul-square']=()=>listStyle('UL','square');
cmds['num-decimal']=()=>listStyle('OL','decimal');cmds['num-alpha']=()=>listStyle('OL','lower-alpha');cmds['num-roman']=()=>listStyle('OL','lower-roman');
cmds['cols-1']=()=>{page.style.columnCount='';scheduleSave();};cmds['cols-2']=()=>{page.style.columnCount='2';page.style.columnGap='28px';scheduleSave();};
function curBlock(){let n=getSelection().anchorNode;while(n&&n!==page&&!(n.nodeType===1&&/^(P|H[1-6]|LI|DIV|BLOCKQUOTE|PRE)$/.test(n.tagName)))n=n.parentNode;return n&&n!==page?n:null;}
cmds.dropcap=()=>{const b=curBlock();if(b){b.classList.toggle('dropcap');scheduleSave();}};
cmds['para-dir']=()=>{const b=curBlock();if(b){b.dir=b.dir==='rtl'?'ltr':'rtl';b.style.textAlign=b.dir==='rtl'?'right':'left';scheduleSave();}};
cmds.spacing=()=>{const b=curBlock();if(!b)return;document.getElementById('sp-b').value=parseFloat(b.style.marginTop)||0;document.getElementById('sp-a').value=b.style.marginBottom?parseFloat(b.style.marginBottom):10;document.getElementById('sp-i').value=parseFloat(b.style.textIndent)||0;openDlg('dlg-spacing');};
document.getElementById('sp-ok').onclick=()=>{document.getElementById('dlg-spacing').close();const b=curBlock();if(!b)return;b.style.marginTop=document.getElementById('sp-b').value+'pt';b.style.marginBottom=document.getElementById('sp-a').value+'pt';b.style.textIndent=document.getElementById('sp-i').value+'pt';scheduleSave();};
cmds.letterspacing=()=>{const v=prompt('Letter spacing in px (0 = normal)','0');if(v==null)return;ex('fontSize',7);page.querySelectorAll('font[size="7"]').forEach(f=>{f.removeAttribute('size');f.style.letterSpacing=v+'px';});scheduleSave();};
/* insert */
cmds.checkbox=()=>insertHTML('<input type="checkbox"> ');
cmds.toc=()=>{const hs=[...page.querySelectorAll('h1,h2,h3')].filter(h=>!h.closest('.toc'));if(!hs.length){toast('Add some headings first');return;}hs.forEach((h,i)=>{if(!h.id)h.id='h-'+i+'-'+uid();});const html='<div class="toc" contenteditable="false"><p><b>Contents</b></p>'+hs.map(h=>`<p class="l${h.tagName[1]}"><a href="#${h.id}">${esc(h.textContent)}</a></p>`).join('')+'</div><p><br></p>';insertHTML(html);};
cmds.footnote=()=>{saveSel();const t=prompt('Footnote text');if(!t)return;let fns=page.querySelector('.footnotes');if(!fns){fns=document.createElement('div');fns.className='footnotes';page.appendChild(fns);}const n=fns.children.length+1;restoreSel();document.execCommand('insertHTML',false,`<sup class="fn">[${n}]</sup>`);const p=document.createElement('p');p.innerHTML=`<sup>${n}</sup> ${esc(t)}`;fns.appendChild(p);scheduleSave();};
cmds.comment=()=>{saveSel();if(getSelection().isCollapsed){toast('Select the text you want to comment on');return;}document.getElementById('cm-text').value='';openDlg('dlg-comment');};
const EMO='😀 😁 😂 🤣 😊 😍 😎 🤔 😅 😢 😡 👍 👎 👏 🙏 💪 ❤️ 💙 💚 💛 🔥 ⭐ ✅ ❌ ⚠️ 💡 📌 📎 📅 📧 📞 🏠 🚗 ✈️ 🎉 🎂 🎁 ☕ 🍕 🍎 🌍 ☀️ 🌙 ⏰ 💰 📈 📉 🔒 🔑 🛒 🏷️ 📦 🖨️ 💻 📱'.split(' ');
const eb=document.getElementById('emoBody');EMO.forEach(e=>{const b=document.createElement('button');b.textContent=e;b.onclick=()=>{document.getElementById('dlg-emoji').close();insertHTML(e);};eb.appendChild(b);});
cmds.emoji=()=>{saveSel();openDlg('dlg-emoji');};
/* images */
const imgbar=document.getElementById('imgbar');let selImg=null;
page.addEventListener('click',e=>{page.querySelectorAll('img.sel').forEach(i=>i.classList.remove('sel'));if(e.target.tagName==='IMG'){selImg=e.target;selImg.classList.add('sel');const r=selImg.getBoundingClientRect(),c=document.getElementById('canvas').getBoundingClientRect();imgbar.style.left=(r.left-c.left+document.getElementById('canvas').scrollLeft)+'px';imgbar.style.top=(r.top-c.top+document.getElementById('canvas').scrollTop-40)+'px';imgbar.classList.add('show');}else{imgbar.classList.remove('show');selImg=null;}
  if(e.target.tagName==='A'&&(e.ctrlKey||e.metaKey)){window.open(e.target.href,'_blank');}});
imgbar.addEventListener('click',e=>{const a=e.target.dataset.img;if(!a||!selImg)return;const i=selImg;i.style.float='';i.style.display='';i.style.margin='';
  if(/^\d+$/.test(a))i.style.width=a+'%';if(a==='left'){i.style.display='block';i.style.margin='0 auto 0 0';}if(a==='center'){i.style.display='block';i.style.margin='0 auto';}if(a==='right'){i.style.display='block';i.style.margin='0 0 0 auto';}
  if(a==='wrapL'){i.style.float='left';i.style.margin='0 12pt 6pt 0';}if(a==='wrapR'){i.style.float='right';i.style.margin='0 0 6pt 12pt';}
  if(a==='caption'){const c=prompt('Caption');if(c){const f=document.createElement('p');f.style.textAlign='center';f.style.fontSize='10pt';f.style.color='#6b7280';f.textContent=c;i.after(f);}}
  if(a==='del'){i.remove();imgbar.classList.remove('show');}scheduleSave();});
document.getElementById('canvas').addEventListener('scroll',()=>imgbar.classList.remove('show'));
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.altKey&&e.key.toLowerCase()==='m'){e.preventDefault();cmds.comment();}});
/* image resize by drag handle (corner) */
page.addEventListener('mousedown',e=>{if(e.target.tagName!=='IMG')return;const i=e.target;const r=i.getBoundingClientRect();if(e.clientX<r.right-16||e.clientY<r.bottom-16)return;e.preventDefault();const sw=i.offsetWidth,sx=e.clientX;const mv=ev=>{i.style.width=Math.max(40,sw+(ev.clientX-sx))+'px';};const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);scheduleSave();};document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
/* autocorrect: straight quotes → curly, -- → —, (c) → © */
page.addEventListener('keyup',e=>{if(e.key!==' ')return;const s=getSelection();const n=s.anchorNode;if(!n||n.nodeType!==3)return;const t=n.data.slice(0,s.anchorOffset);const m=t.match(/(--|\(c\)|\(r\)|\(tm\)|->)\s$/);if(!m)return;const rep={'--':'—','(c)':'©','(r)':'®','(tm)':'™','->':'→'}[m[1]];const a=s.anchorOffset-m[0].length;n.data=n.data.slice(0,a)+rep+' '+n.data.slice(s.anchorOffset);s.collapse(n,a+rep.length+1);});
function cleanHtml(){const c=page.cloneNode(true);c.querySelectorAll('.guide,img.sel').forEach(g=>g.classList?.contains('guide')?g.remove():g.classList.remove('sel'));return c.innerHTML;}
cmds['cols-1']=()=>{cur.cols=1;page.style.columnCount='';save();};cmds['cols-2']=()=>{cur.cols=2;page.style.columnCount='2';page.style.columnGap='28px';save();};
const _al=afterLoad;afterLoad=function(){_al();page.style.columnCount=cur.cols===2?'2':'';};
cmds['export-html']=()=>download(cur.name+'.html',`<!DOCTYPE html><html dir="${page.dir}"><head><meta charset="utf-8"><title>${esc(cur.name)}</title><style>body{font-family:Georgia,serif;max-width:800px;margin:40px auto;line-height:1.5}table{border-collapse:collapse}td,th{border:1px solid #999;padding:4px 6px}img{max-width:100%}.cmt{background:#fff1a8}.footnotes{border-top:1px solid #999;font-size:.8em}</style></head><body>${cur.hdr?`<header style="color:#777;font-size:.8em">${cur.hdr}</header>`:''}${cleanHtml()}${cur.ftr?`<footer style="color:#777;font-size:.8em">${cur.ftr}</footer>`:''}</body></html>`,'text/html');
document.getElementById('scrim').onclick=()=>cmds.sidebar();
// close drawer after picking a doc on mobile
document.getElementById('doclist').addEventListener('click',()=>{if(matchMedia('(max-width:900px)').matches&&!document.getElementById('side').classList.contains('hidden'))cmds.sidebar();});
// touch: image resize with pointer events, long-press selects image
page.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||e.target.tagName!=='IMG')return;const i=e.target;const r=i.getBoundingClientRect();if(e.clientX<r.right-28||e.clientY<r.bottom-28)return;e.preventDefault();const sw=i.offsetWidth,sx=e.clientX;const mv=ev=>{i.style.width=Math.max(40,sw+(ev.clientX-sx))+'px';};const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);scheduleSave();};document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);});
afterLoad();
